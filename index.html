<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.supabase.co; style-src 'unsafe-inline'">
<title>Feedback Agence</title>
<style>
  body { font: 14px system-ui, "Segoe UI", sans-serif; margin: 0; padding: 14px; color: #1f2937; background: #f8fafc; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  input, textarea, button { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; font: inherit; border: 1px solid #d1d5db; border-radius: 6px; }
  button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
  button.link { background: none; color: #6b7280; width: auto; padding: 0; margin: 0; text-decoration: underline; }
  textarea { resize: vertical; min-height: 70px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .fb { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .fb.unread { border-left: 4px solid #e11d48; background: #fff1f2; }
  .meta { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
  .msg { white-space: pre-wrap; }
  .reply { margin: 6px 0 0 8px; padding-left: 8px; border-left: 3px solid #e5e7eb; }
  .err { color: #dc2626; font-size: 12px; min-height: 16px; }
  #login { max-width: 320px; margin: 60px auto 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="login" hidden>
    <h3>Connexion</h3>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mot de passe">
    <button id="loginBtn">Se connecter</button>
    <div id="loginErr" class="err"></div>
  </div>
  <div id="main" hidden>
    <div class="top"><strong id="who"></strong><button id="logoutBtn" class="link">Déconnexion</button></div>
    <h3>Mes feedbacks</h3>
    <div id="list"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
