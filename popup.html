<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau feedback</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; --alert:#e11d48; --recv:#e5e7eb; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#fff; display:flex; flex-direction:column; user-select:none; }
  header { background:var(--alert); color:#fff; padding:14px 20px; }
  header b { font-size:17px; }
  header span { display:block; font-size:12px; opacity:.9; }
  main { flex:1; overflow-y:auto; padding:16px 20px; user-select:text; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; background:#dbeafe; color:#1d4ed8; }
  .bubble { background:var(--recv); border-radius:12px; border-bottom-left-radius:3px; padding:10px 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bubble img { display:block; max-width:100%; max-height:240px; margin-top:8px; border-radius:8px; }
  footer { padding:12px 20px 16px; border-top:1px solid var(--line); }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  textarea { width:100%; min-height:80px; resize:none; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:6px; user-select:text; }
  textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:10px; padding:11px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--alert); font-size:13px; min-height:18px; margin:6px 0 0; }
  [hidden] { display:none !important; }

  /* Alerte visuelle : l'en-tête pulse et la cloche se balance */
  header { animation:alerte 1.1s ease-in-out infinite; }
  header b::before { content:"🔔 "; display:inline-block; transform-origin:top center; animation:sonne .6s ease-in-out infinite; }
  @keyframes alerte { 0%,100% { background:#e11d48; } 50% { background:#f97316; } }
  @keyframes sonne { 0%,100% { transform:rotate(0); } 25% { transform:rotate(18deg); } 75% { transform:rotate(-18deg); } }
  @media (prefers-reduced-motion: reduce) { header, header b::before { animation:none; } }
</style>
</head>
<body>
  <header>
    <b>Nouveau feedback</b>
    <span id="counter">Chargement…</span>
  </header>
  <main>
    <div class="meta"><span id="date"></span><span id="model" class="tag" hidden></span></div>
    <div id="bubble" class="bubble"></div>
  </main>
  <footer>
    <label for="reply">Votre réponse (facultatif)</label>
    <textarea id="reply" placeholder="Écrivez ici pour répondre…"></textarea>
    <p id="err" class="err" role="alert"></p>
    <button id="go" type="button" disabled>J'ai lu</button>
  </footer>

<script>
const db = supabase.createClient("https://mzjiyusbgtslfzchoykf.supabase.co", "sb_publishable_6JGumr_7n73O3U6MjRdgkw_5mZH46cc");
const $ = id => document.getElementById(id);
let uid = null, queue = [], timer = null;

function finish() {
  clearInterval(timer);
  clearInterval(remindTimer);
  $("go").disabled = true;
  $("counter").textContent = "Terminé";
  if (window.native) window.native.popupDone(); // ferme le pop-up et libère l'écran
  else $("bubble").textContent = "Tous les feedbacks sont lus. Vous pouvez fermer cet onglet.";
}

async function fetchUnread() {
  const { data, error } = await db.from("feedbacks").select("id,message,image_url,created_at,modele")
    .eq("agent_id", uid).eq("lu", false).order("created_at", { ascending: true });
  return error ? null : data;
}

function render() {
  const f = queue[0];
  $("counter").textContent = queue.length > 1 ? `${queue.length} feedbacks à lire` : "1 feedback à lire";
  $("date").textContent = new Date(f.created_at).toLocaleString("fr-FR");
  $("model").hidden = !f.modele;
  $("model").textContent = f.modele ? "Modèle : " + f.modele : "";
  const b = $("bubble");
  b.replaceChildren();
  if (f.message) b.append(document.createTextNode(f.message));
  if (f.image_url) {
    const img = document.createElement("img");
    img.src = f.image_url; img.alt = "Image jointe";
    b.appendChild(img);
  }
  $("reply").value = "";
  updateBtn();
  $("go").disabled = false;
  $("reply").focus();
}
function updateBtn() { $("go").textContent = $("reply").value.trim() ? "Envoyer la réponse et continuer" : "J'ai lu"; }
$("reply").addEventListener("input", updateBtn);

/* ---------- Sonnette de comptoir dynamique (générée par le navigateur, aucun fichier à ajouter) ---------- */
const BELL_VOLUME = 0.8;  // 0 = muet, 1 = très fort
const DINGS = 3;          // nombre de coups à chaque sonnerie
const GAP = 0.14;         // secondes entre deux coups (plus petit = plus pressé)
const REMIND_MS = 8000;   // la sonnerie se répète tant que le pop-up n'est pas traité (0 = une seule fois)
let audioCtx = null, master = null, remindTimer = null;

function ding(t0, gain, base, ring) {
  const out = audioCtx.createGain();
  out.gain.value = 0.3 * BELL_VOLUME * gain;
  out.connect(master);

  // le « clac » métallique du marteau
  const len = Math.floor(audioCtx.sampleRate * 0.025);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const click = audioCtx.createBufferSource();
  click.buffer = buf;
  const hp = audioCtx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 3500;
  click.connect(hp).connect(out);
  click.start(t0);

  // la cloche : notes très aiguës qui s'éteignent à des rythmes différents
  [[1, 1, 1.5], [1.006, 0.8, 1.5], [2.32, 0.5, 1.0], [4.25, 0.3, 0.6], [6.63, 0.18, 0.35]].forEach(([ratio, amp, decay]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const dur = decay * ring;
    o.type = "sine";
    o.frequency.value = base * ratio;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(out);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  });
}

function playBell() {
  if (!BELL_VOLUME) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createDynamicsCompressor(); // évite la saturation quand les coups se chevauchent
      master.connect(audioCtx.destination);
    }
    audioCtx.resume().then(() => {
      const t = audioCtx.currentTime + 0.05;
      for (let i = 0; i < DINGS; i++) {
        const last = i === DINGS - 1;
        // chaque coup est un peu plus aigu et plus fort : effet « ça presse » ; le dernier résonne plus longtemps
        ding(t + i * GAP, 0.8 + i * 0.1, 2650 * (1 + i * 0.07), last ? 1.6 : 0.7);
      }
    }).catch(() => {});
  } catch (e) {}
}
function startReminder() {
  if (REMIND_MS && !remindTimer) remindTimer = setInterval(playBell, REMIND_MS);
}
const seen = new Set(); // feedbacks déjà annoncés par la cloche

async function refresh() {
  const rows = await fetchUnread();
  if (!rows) return; // erreur réseau : on garde l'affichage actuel
  const prev = queue[0]?.id;
  queue = rows;
  if (!queue.length) return finish();
  if (queue.some(f => !seen.has(f.id))) { playBell(); startReminder(); } // sonnerie à l'ouverture et à chaque nouveau feedback
  queue.forEach(f => seen.add(f.id));
  if (queue[0].id !== prev) render();
  else $("counter").textContent = queue.length > 1 ? `${queue.length} feedbacks à lire` : "1 feedback à lire";
}

$("go").addEventListener("click", async () => {
  const f = queue[0];
  if (!f) return;
  const text = $("reply").value.trim();
  $("go").disabled = true;
  $("err").textContent = "";
  try {
    if (text) {
      const { error } = await db.from("reponses").insert({ feedback_id: f.id, auteur_id: uid, message: text });
      if (error) throw new Error(error.message);
    }
    const { data, error } = await db.from("feedbacks").update({ lu: true }).eq("id", f.id).select("id");
    if (error || !data || !data.length) throw new Error(error ? error.message : "droits manquants");
  } catch (e) {
    $("err").textContent = "Envoi impossible : " + e.message;
    $("go").disabled = false;
    return;
  }
  await refresh();
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return finish(); // pas connecté : rien à bloquer
  uid = session.user.id;
  await refresh();
  timer = setInterval(refresh, 10000); // les nouveaux feedbacks s'ajoutent à la file
})();
</script>
</body>
</html>
