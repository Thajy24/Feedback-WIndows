<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https://*.supabase.co data: blob:; style-src 'unsafe-inline'">
<title>Nouveau feedback</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 15px system-ui, "Segoe UI", sans-serif; color: #1f2937; overflow: hidden; }
  .dim { position: fixed; inset: 0; background: rgba(15, 23, 42, .6); display: grid; place-items: center; }
  .nob .dim { background: #f8fafc; }
  .card { width: min(480px, 92vw); max-height: 90vh; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.35); border-top: 5px solid #e11d48; }
  .nob .card { box-shadow: none; width: 100%; height: 100%; max-height: none; border-radius: 0; box-sizing: border-box; }
  h2 { margin: 0 0 2px; font-size: 18px; }
  .meta { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #dbeafe; color: #1d4ed8; margin-left: 6px; }
  #body { overflow-y: auto; margin-bottom: 16px; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.5; background: #e5e7eb; padding: 10px 14px; border-radius: 12px; border-bottom-left-radius: 3px; }
  #img { display: block; max-width: 100%; max-height: 38vh; margin-top: 10px; border-radius: 8px; }
  button { font: inherit; width: 100%; padding: 11px; border-radius: 8px; border: 0; cursor: pointer; margin-bottom: 8px; }
  #ok, #send { background: #2563eb; color: #fff; font-weight: 600; }
  #reply { background: #e5e7eb; color: #1f2937; }
  textarea { width: 100%; box-sizing: border-box; min-height: 80px; padding: 10px; font: inherit; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 8px; resize: none; }
  #file { width: 100%; box-sizing: border-box; margin-bottom: 8px; font: inherit; font-size: 13px; }
  #prev { max-width: 120px; max-height: 80px; border-radius: 6px; margin-bottom: 8px; display: block; }
  #err { font-size: 12px; color: #dc2626; min-height: 14px; }
  #count { font-size: 12px; color: #6b7280; text-align: center; margin-top: 2px; }
  :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="dim">
    <div class="card" id="card" role="alertdialog" aria-labelledby="title">
      <h2 id="title">Nouveau feedback</h2>
      <div class="meta"><span id="date"></span><span id="modele" class="tag" hidden></span></div>
      <div id="body">
        <div id="text"></div>
        <img id="img" alt="Image jointe" hidden>
      </div>
      <button id="ok">Oui, j'ai lu</button>
      <button id="reply">Répondre</button>
      <div id="replyBox" hidden>
        <textarea id="ta" placeholder="Votre réponse..."></textarea>
        <input id="file" type="file" accept="image/*" aria-label="Joindre une image">
        <img id="prev" alt="Aperçu" hidden>
        <button id="send">Envoyer la réponse</button>
        <div id="err"></div>
      </div>
      <div id="count"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
