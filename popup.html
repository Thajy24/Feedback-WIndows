<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#0f1330; --muted:#667091; --line:#e4e6f2; --accent:#4f46e5; --accent2:#7c3aed; --alert:#e11d48; --recv:#f1f2fa; --card:#fff; --bg:#f3f4fb; --accent-soft:#eef0ff;
    --grad:linear-gradient(135deg,#4f46e5,#7c3aed); }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.5 "Segoe UI",Inter,system-ui,-apple-system,sans-serif; color:var(--ink); display:flex; flex-direction:column; user-select:none; overflow:hidden;
    background:radial-gradient(700px 400px at 0% -10%,rgba(79,70,229,.16),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(6,182,212,.12),transparent 60%),var(--bg); }

  header { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; padding:16px 20px; color:#fff;
    background:linear-gradient(120deg,#1e1b6b 0%,#4f46e5 55%,#7c3aed 100%); box-shadow:0 10px 28px -12px rgba(79,70,229,.7); animation:drop .45s cubic-bezier(.2,.8,.2,1) both; }
  header::after { content:""; position:absolute; top:0; bottom:0; width:90px; left:-120px; background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent); transform:skewX(-20deg); animation:shine 5s ease-in-out infinite; }
  header .chip { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; flex:none; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(6px); }
  header .chip svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transform-origin:50% 10%; animation:swing 4s ease-in-out infinite; }
  header b { font-size:16px; font-weight:700; display:block; letter-spacing:-.01em; }
  header span { display:block; font-size:12px; opacity:.85; font-weight:500; }

  main { flex:1; overflow-y:auto; padding:18px 20px; user-select:text; }
  main.slide { animation:rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-weight:600; }
  .tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; background:#ece9ff; color:#5b3fd6; letter-spacing:.02em; }
  .bubble { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent2); border-radius:14px; padding:14px 18px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(15,19,48,.05),0 14px 30px -16px rgba(79,70,229,.35); }
  .bubble img { display:block; max-width:100%; max-height:240px; margin-top:10px; border-radius:10px; }
  .ctx { font-size:12px; color:#56608a; border-left:3px solid var(--accent); padding:6px 10px; margin-bottom:10px; overflow-wrap:anywhere; background:#eef0ff; border-radius:0 8px 8px 0; }

  footer { padding:14px 20px 18px; border-top:1px solid var(--line); background:var(--card); box-shadow:0 -10px 24px -18px rgba(15,19,48,.25); }
  label { display:block; font-size:12px; font-weight:700; color:#4b5478; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
  textarea { width:100%; min-height:80px; resize:none; font:inherit; padding:10px 12px; border:1px solid #d5d9ec; border-radius:10px; user-select:text; color:var(--ink); background:var(--card); transition:border-color .2s, box-shadow .2s; }
  textarea:hover { border-color:#b8bfe0; }
  textarea:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 4px rgba(79,70,229,.14); }
  button { width:100%; margin-top:10px; padding:11px; font:inherit; font-weight:600; color:#fff; background:var(--grad); border:0; border-radius:10px; cursor:pointer; box-shadow:0 8px 18px -8px rgba(79,70,229,.7); transition:transform .18s, box-shadow .18s, filter .18s; }
  button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 12px 24px -10px rgba(79,70,229,.8); filter:brightness(1.06); }
  button:active:not(:disabled) { transform:scale(.98); }
  button:disabled { opacity:.5; cursor:default; box-shadow:none; }
  .err { color:var(--alert); font-size:13px; font-weight:500; min-height:18px; margin:6px 0 0; }
  [hidden] { display:none !important; }

  @keyframes drop { from { transform:translateY(-100%); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes shine { 0%,60% { left:-120px; } 100% { left:110%; } }
  @keyframes swing { 0%,70%,100% { transform:rotate(0); } 75% { transform:rotate(14deg); } 80% { transform:rotate(-12deg); } 85% { transform:rotate(8deg); } 90% { transform:rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  html[data-theme=dark] { color-scheme:dark; --ink:#e8e9ff; --muted:#9aa3c7; --line:#262b55; --card:#11153a; --bg:#080b1d; --recv:#1a1f48; --accent-soft:#1b2154; }
  html[data-theme=dark] body { background:radial-gradient(700px 400px at 0% -10%,rgba(79,70,229,.3),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(124,58,237,.2),transparent 60%),var(--bg); }
  html[data-theme=dark] textarea { background:#0b0e29; color:var(--ink); border-color:#2d3466; }
  html[data-theme=dark] label { color:#aab1da; }
  html[data-theme=dark] .tag { background:#2e2670; color:#c4b5fd; }
  html[data-theme=dark] .ctx { background:#1b2154; color:#b7bde0; }

/* ----- Aperçu photo (zoom) ----- */
.lb{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:rgba(8,10,28,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lb.open{display:flex;animation:fadein .2s ease both}
.lb .bar{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}
.lb .bar button{width:auto;margin:0;padding:7px 13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);box-shadow:none;font-size:13px;font-weight:600;color:#fff;border-radius:9px}
.lb .bar button:hover:not(:disabled){background:rgba(255,255,255,.24);transform:none;box-shadow:none;filter:none}
.lb .bar .lvl{color:#fff;font-weight:700;min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.lb .stage{flex:1;overflow:hidden;display:grid;place-items:center;cursor:grab;touch-action:none}
.lb .stage.drag{cursor:grabbing}
.lb img{max-width:92vw;max-height:78vh;transform-origin:center;transition:transform .12s ease-out;user-select:none;-webkit-user-drag:none;border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.55);cursor:inherit}
.lb .stage.drag img{transition:none}

/* ----- Menu clic droit ----- */
.ctxm{position:fixed;z-index:300;min-width:220px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 48px -14px rgba(15,19,48,.45);animation:fadein .12s ease both}
.ctxm button{display:flex;justify-content:space-between;align-items:center;gap:22px;width:100%;margin:0;padding:8px 10px;background:none;color:var(--ink);box-shadow:none;border-radius:8px;font-weight:500;font-size:13px;text-align:left}
.ctxm button:hover:not(:disabled),.ctxm button:focus-visible{background:var(--accent-soft);color:var(--accent);transform:none;box-shadow:none;filter:none;outline:0}
.ctxm button.danger:hover:not(:disabled),.ctxm button.danger:focus-visible{background:#fff1f3;color:var(--alert)}
.ctxm kbd{font:inherit;font-size:11px;opacity:.55}
.ctxm hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
html[data-theme=dark] .ctxm button.danger:hover:not(:disabled),html[data-theme=dark] .ctxm button.danger:focus-visible{background:#3a1020;color:#fda4af}

/* ----- Notification discrète ----- */
.toast{position:fixed;left:50%;bottom:28px;z-index:400;padding:9px 18px;border-radius:99px;background:#0f1330;color:#fff;font-weight:600;font-size:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.55);animation:toastin .25s ease both}
.toast.out{animation:toastout .35s ease forwards}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,6px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ----- Message vocal ----- */
.voice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.voice button{width:auto;margin:0;padding:7px 14px;font-size:13px}
.voice button.mic{background:var(--card);color:var(--ink);border:1px solid #cfd4ea;box-shadow:none}
.voice button.mic::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alert);margin-right:8px}
.voice button.mic:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);transform:none;box-shadow:none;filter:none}
.voice button.stop{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 6px 14px -6px rgba(225,29,72,.6)}
.voice button.plain{background:var(--card);color:var(--ink);border:1px solid #cfd4ea;box-shadow:none}
.voice button.plain:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);transform:none;box-shadow:none;filter:none}
.voice .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--alert);min-width:38px}
.voice .recdot{width:10px;height:10px;border-radius:50%;background:var(--alert);animation:recpulse 1s ease-in-out infinite}
.voice audio{height:38px;max-width:100%}
@keyframes recpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.bubble audio{display:block;width:260px;max-width:100%;height:38px;margin-top:8px}
html[data-theme=dark] .voice button.mic,html[data-theme=dark] .voice button.plain{border-color:#2d3466}

/* ----- Images multiples, collage d'image ou de lien ----- */
.pick{margin:6px 0 10px}

.pick .msg:empty{display:none}
.imgs{display:flex;flex-wrap:wrap;gap:6px}

/* ----- Feedback simple / urgent ----- */
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:6px 0 12px}
.tp{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;color:var(--ink);margin:0;transition:border-color .2s,box-shadow .2s,background .2s}
.tp:hover{border-color:var(--accent)}
.tp input{width:auto;margin:3px 0 0;flex:none;accent-color:var(--accent)}
.tp .tpt{flex:1;min-width:0}
.tp b{display:block;font-size:14px}
.tp.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.tp.urgent.on{border-color:#e11d48;background:rgba(225,29,72,.07);box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.tp.urgent input{accent-color:#e11d48}
.tag.urgent{background:#e11d48;color:#fff;animation:urgpulse 1.4s ease-in-out infinite}
@keyframes urgpulse{50%{box-shadow:0 0 0 5px rgba(225,29,72,.25)}}
.fdir.urg>summary{border-left:4px solid #e11d48;background:rgba(225,29,72,.06)}
.fdir.urg .fi{background:linear-gradient(135deg,#fb7185,#e11d48)}

.urgban{display:none;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:12px;background:#e11d48;color:#fff;font-weight:800;letter-spacing:.06em;animation:urgpulse 1.4s ease-in-out infinite}
.urgban svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
body.urgent .urgban{display:flex}
body.urgent header{background:linear-gradient(135deg,#9f1239,#e11d48 60%,#fb7185)}

.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere;word-break:break-word}
.bubble.sent .lnk{color:inherit;font-weight:600}
.lnk:hover{text-decoration-thickness:2px}
</style>

<script>
/* ---------- Outils communs : notification, menu clic droit, aperçu photo (zoom), message vocal ---------- */
function toast(text) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("out"), 1800);
  setTimeout(() => t.remove(), 2200);
}

/* Menu contextuel (clic droit, ou touche « menu » / Maj+F10 du clavier) */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function menuPos(ev, el) {
  if (ev.clientX || ev.clientY) return [ev.clientX, ev.clientY]; // déclenché au clavier : pas de coordonnées
  const r = el.getBoundingClientRect();
  return [r.left + 24, r.top + 24];
}
function showMenu(x, y, items) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "ctxm";
  m.setAttribute("role", "menu");
  items.forEach(it => {
    if (it === "-") { m.appendChild(document.createElement("hr")); return; }
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "menuitem");
    if (it.danger) b.className = "danger";
    const l = document.createElement("span");
    l.textContent = it.label;
    b.appendChild(l);
    if (it.key) { const k = document.createElement("kbd"); k.textContent = it.key; b.appendChild(k); }
    b.addEventListener("click", ev => { ev.stopPropagation(); closeMenu(); it.fn(); });
    m.appendChild(b);
  });
  m.addEventListener("keydown", ev => {
    const bs = [...m.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
    if (ev.key === "ArrowDown") { ev.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  });
  document.body.appendChild(m);
  m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + "px";
  menuEl = m;
  const first = m.querySelector("button");
  if (first) first.focus();
}
document.addEventListener("click", closeMenu);
document.addEventListener("scroll", closeMenu, true);
window.addEventListener("resize", closeMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape" && menuEl) { e._menuClosed = true; closeMenu(); } }, true);

/* Images : télécharger, copier, ouvrir */
async function imgBlob(src) {
  try {
    const r = await fetch(imgFix.get(src) || src);
    if (!r.ok) throw new Error("http " + r.status);
    return await r.blob();
  } catch (e) {
    const p = storagePath(src);
    if (!p) throw e;
    const { data, error } = await db.storage.from(BUCKET).download(p);
    if (error || !data) throw e;
    return data;
  }
}
async function downloadImage(src) {
  try {
    const b = await imgBlob(src);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = decodeURIComponent(src.split("/").pop().split("?")[0]) || "image";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { window.open(src, "_blank", "noopener"); }
}
async function copyImage(src) {
  try {
    let b = await imgBlob(src);
    if (b.type !== "image/png") {
      const bmp = await createImageBitmap(b), c = document.createElement("canvas");
      c.width = bmp.width; c.height = bmp.height;
      c.getContext("2d").drawImage(bmp, 0, 0);
      b = await new Promise(res => c.toBlob(res, "image/png"));
    }
    await navigator.clipboard.write([new ClipboardItem({ "image/png": b })]);
    toast("Image copiée");
  } catch (e) { toast("Copie impossible"); }
}
function imageMenuBase(src) {
  return [
    { label: "Télécharger l'image", fn: () => downloadImage(src) },
    { label: "Copier l'image", fn: () => copyImage(src) },
    { label: "Ouvrir dans un nouvel onglet", fn: () => window.open(src, "_blank", "noopener") }
  ];
}
function imageMenu(src) { return [{ label: "Agrandir", fn: () => openLightbox(src) }, ...imageMenuBase(src)]; }

/* Aperçu plein écran : boutons +/−, molette, glisser, double-clic, raccourcis clavier */
const LB = { el: null, img: null, stage: null, lvl: null, z: 1, x: 0, y: 0, src: "" };
const Z_MIN = 0.25, Z_MAX = 8;
const lbOpen = () => !!(LB.el && LB.el.classList.contains("open"));
function lbApply() {
  LB.img.style.transform = `translate(${LB.x}px,${LB.y}px) scale(${LB.z})`;
  LB.lvl.textContent = Math.round(LB.z * 100) + " %";
}
function lbZoom(f, cx, cy) {
  const nz = Math.min(Z_MAX, Math.max(Z_MIN, LB.z * f));
  if (nz === LB.z) return;
  const k = nz / LB.z;
  if (cx != null) { // le point sous le curseur reste fixe
    const r = LB.stage.getBoundingClientRect(), ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
    LB.x = ox - (ox - LB.x) * k;
    LB.y = oy - (oy - LB.y) * k;
  } else { LB.x *= k; LB.y *= k; }
  LB.z = nz;
  lbApply();
}
function lbReset() { LB.z = 1; LB.x = 0; LB.y = 0; lbApply(); }
function lbActual() {
  const nw = LB.img.naturalWidth, w = LB.img.offsetWidth;
  if (!nw || !w) return;
  LB.z = Math.min(Z_MAX, nw / w); LB.x = 0; LB.y = 0;
  lbApply();
}
function lbClose() {
  if (!LB.el) return;
  LB.el.classList.remove("open");
  LB.img.removeAttribute("src");
}
function lbMenu(x, y) {
  showMenu(x, y, [
    { label: "Zoom avant", key: "+", fn: () => lbZoom(1.4) },
    { label: "Zoom arrière", key: "−", fn: () => lbZoom(1 / 1.4) },

/* Message vocal : enregistrer, réécouter, supprimer avant envoi */
const MAX_REC = 300; // 5 minutes
const recs = new Set();
const recActive = () => { let on = false; recs.forEach(r => { if (!r.el.isConnected) { recs.delete(r); if (r.state() === "rec") r.reset(); } else if (r.state() !== "idle") on = true; }); return on; };
function voiceRecorder(onChange) {
  const el = document.createElement("div");

  let mr = null, stream = null, tick = null, t0 = 0, chunks = [], blob = null, url = null, state = "idle", cancelled = false, timerEl = null, msg = "";
  const mk = (label, cls, fn) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.className = cls;
    b.addEventListener("click", ev => { ev.stopPropagation(); fn(); });
    return b;
  };
  const fmtT = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  function draw() {
    el.replaceChildren();
    timerEl = null;
    if (state === "idle") {
      el.appendChild(mk("Message vocal", "mic", start));
    } else if (state === "rec") {
      const dot = document.createElement("i");
      dot.className = "recdot";
      timerEl = document.createElement("span");
      timerEl.className = "timer";
      timerEl.textContent = fmtT((Date.now() - t0) / 1000);
      el.append(dot, timerEl, mk("Terminer", "stop", stop), mk("Annuler", "plain", cancel));
    } else {
      const a = document.createElement("audio");
      a.controls = true; a.src = url; a.preload = "metadata";
      el.append(a, mk("Supprimer le vocal", "plain", reset));
    }
    if (msg) {
      const n = document.createElement("span");
      n.style.cssText = "font-size:12px;font-weight:500;color:var(--alert)";
      n.textContent = msg;
      el.appendChild(n);
    }
  }

    msg = "";

    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { msg = "Micro inaccessible : autorisez-le puis réessayez."; draw(); return; }
    const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find(t => MediaRecorder.isTypeSupported(t)) || "";

      else {

      }

    state = "rec";
    draw();
    tick = setInterval(() => {
      const s = (Date.now() - t0) / 1000;

      if (s >= MAX_REC) stop();
    }, 250);
  }
  function stop() { if (mr && mr.state !== "inactive") mr.stop(); }
  function cancel() { cancelled = true; stop(); }

    if (state === "rec") { cancel(); return; }

}

/* ---------- Sonneries : feedback simple (notification discrète) et feedback urgent (alarme) ---------- */
const RING_VOLUME = 0.8; // 0 = muet, 1 = fort
// [début en s, fréquence en Hz, durée en s, intensité]
const RING_SIMPLE = [[0, 987.77, 0.30, 0.55], [0.11, 1318.51, 0.55, 0.60]]; // deux notes montantes, doux « pop-pop » de messagerie
const RING_URGENT = [];                                                      // 3 séries de 3 bips aigus alternés, façon alarme
for (let g = 0; g < 3; g++) [1175, 880, 1175].forEach((f, i) => RING_URGENT.push([g * 0.95 + i * 0.2, f, 0.15, 0.6]));
let ringCtx = null, ringOut = null;
function playRing(kind) {
  if (!RING_VOLUME) return;
  try {
    if (!ringCtx) {
      ringCtx = new (window.AudioContext || window.webkitAudioContext)();
      ringOut = ringCtx.createDynamicsCompressor();
      ringOut.connect(ringCtx.destination);
    }
    ringCtx.resume().then(() => {
      const t0 = ringCtx.currentTime + 0.05, urgent = kind === "urgent";
      const master = ringCtx.createGain();
      master.gain.value = RING_VOLUME;
      master.connect(ringOut);
      (urgent ? RING_URGENT : RING_SIMPLE).forEach(([at, f, dur, amp]) => {
        const t = t0 + at, g = ringCtx.createGain();
        g.connect(master);
        if (urgent) { // bip carré (harmoniques 1, 3, 5) : net, qui perce
          const re = new Float32Array(6), im = new Float32Array(6);
          im[1] = 1; im[3] = 1 / 3; im[5] = 1 / 5;
          const o = ringCtx.createOscillator();
          o.setPeriodicWave(ringCtx.createPeriodicWave(re, im));
          o.frequency.value = f;
          o.connect(g);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(amp, t + 0.005);
          g.gain.setValueAtTime(amp, t + dur - 0.015);
          g.gain.linearRampToValueAtTime(0, t + dur);
          o.start(t); o.stop(t + dur + 0.02);
        } else { // note douce : sinus + une octave plus haut, qui s'éteint progressivement
          [[1, 1], [2, 0.2]].forEach(([mult, a]) => {
            const o = ringCtx.createOscillator(), h = ringCtx.createGain();
            o.type = "sine"; o.frequency.value = f * mult;
            h.gain.value = a;
            o.connect(h).connect(g);
            o.start(t); o.stop(t + dur + 0.02);
          });
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(amp, t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        }
      });
    }).catch(() => {});
  } catch (e) {}
}

/* ---------- Liens cliquables dans les messages (texte sûr : jamais de HTML) ---------- */
function linkify(parent, text) {
  const re = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;
  let last = 0, m;
  text = String(text || "");
  while ((m = re.exec(text))) {
    let url = m[0], tail = "";
    while (/[.,;:!?»"')\]}]$/.test(url)) { // ponctuation de fin de phrase : hors du lien ; « ) » seulement s'il n'est pas ouvert dans le lien
      const c = url.slice(-1);
      if (c === ")" && (url.match(/\(/g) || []).length >= (url.match(/\)/g) || []).length) break;
      tail = c + tail; url = url.slice(0, -1);
    }
    let href = /^www\./i.test(url) ? "https://" + url : url;
    try { const u = new URL(href); if (!/^https?:$/.test(u.protocol)) throw 0; href = u.href; } catch (e) { continue; }
    if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement("a");
    a.className = "lnk"; a.href = href; a.textContent = url;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    a.addEventListener("click", ev => { if (document.body.classList.contains("selecting")) ev.preventDefault(); else ev.stopPropagation(); });
    parent.append(a);
    last = m.index + url.length;
    re.lastIndex = last;
  }
  if (last < text.length) parent.append(document.createTextNode(text.slice(last)));
}

/* ---------- Images : plusieurs par message ; coller une image (Ctrl+V) ou un lien d'image ---------- */
const MAX_IMAGES = 10;

const isImageLink = t => /^https?:\/\/\S+?(\.(png|jpe?g|gif|webp|avif|bmp|svg)(\?\S*)?(#\S*)?|\/storage\/v1\/object\/public\/\S+)$/i.test(t);

function imagePicker(ta, onChange) {
  const el = document.createElement("div");
  el.className = "pick";
  const row = document.createElement("div");
  row.className = "pickrow";
  const fi = document.createElement("input");
  fi.type = "file"; fi.accept = "image/*"; fi.multiple = true;
  fi.setAttribute("aria-label", "Ajouter des images");

  hint.className = "pickhint";

  row.append(fi, hint);
  const grid = document.createElement("div");
  grid.className = "pickgrid"; grid.hidden = true;
  const note = document.createElement("p");
  note.className = "msg err";
  el.append(row, grid, note);
  let items = [];
  const changed = () => { if (onChange) onChange(); };
  const free = it => { if (it.file) URL.revokeObjectURL(it.src); };
  function paint() {
    grid.replaceChildren();
    grid.hidden = !items.length;
    items.forEach((it, i) => {
      const w = document.createElement("div");
      w.className = "thumb";
      const img = document.createElement("img");
      img.src = it.src; img.alt = "Image " + (i + 1);
      bindImage(img, it.src, false);
      img.addEventListener("error", () => {
        if (!it.url || !items.includes(it)) return; // seuls les liens peuvent être invalides
        items = items.filter(x => x !== it);
        note.textContent = "Ce lien n'est pas une image accessible : " + (it.url || "").slice(0, 80);
        paint(); changed();
      });
      const x = document.createElement("button");
      x.type = "button"; x.className = "rm"; x.textContent = "×";
      x.title = "Retirer cette image"; x.setAttribute("aria-label", "Retirer l'image " + (i + 1));
      x.addEventListener("click", ev => { ev.stopPropagation(); free(it); items = items.filter(y => y !== it); note.textContent = ""; paint(); changed(); });
      w.append(img, x);
      grid.appendChild(w);
    });
  }
  function room(n) {
    if (items.length + n <= MAX_IMAGES) return true;
    note.textContent = "Maximum " + MAX_IMAGES + " images par message.";
    return false;
  }
  function add(files) {
    note.textContent = "";
    const list = [...files].filter(f => f.type.startsWith("image/"));
    if (!list.length) { if (files.length) note.textContent = "Seules les images sont acceptées."; return; }
    const keep = list.slice(0, Math.max(0, MAX_IMAGES - items.length));
    if (keep.length < list.length) note.textContent = "Maximum " + MAX_IMAGES + " images par message.";
    keep.forEach(f => items.push({ file: f, src: URL.createObjectURL(f) }));
    paint(); changed();
  }
  function addLink(u) {
    note.textContent = "";
    if (items.some(it => it.url === u)) return;
    if (!room(1)) return;
    items.push({ url: u, src: u });
    paint(); changed();
  }
  fi.addEventListener("change", () => { add(fi.files); fi.value = ""; });
  if (ta) ta.addEventListener("paste", ev => {
    const cd = ev.clipboardData;
    if (!cd) return;
    const files = [...(cd.files || [])].filter(f => f.type.startsWith("image/"));
    if (files.length) { ev.preventDefault(); add(files); return; }
    const t = (cd.getData("text") || "").trim();
    if (t && !/\s/.test(t) && isImageLink(t)) { ev.preventDefault(); addLink(t); } // lien d'image : joint comme image
  });
  const api = {
    el, any: () => items.length > 0, count: () => items.length, add, addLink,
    reset() { items.forEach(free); items = []; note.textContent = ""; fi.value = ""; paint(); changed(); },
    // Envoie les fichiers puis renvoie la valeur à enregistrer : un lien par ligne (ou null)
    async value() {
      const out = [];
      for (const it of items) out.push(it.file ? await uploadImage(it.file) : it.url);
      return out.length ? out.join("\n") : null;
    }
  };
  imgPickers.add(api);
  return api;
}

/* Image robuste : lien public -> URL signée -> téléchargement direct (si le bucket est privé ou le lien public bloqué) */
const imgFix = new Map(); // lien d'origine -> lien utilisable
function storagePath(u) {
  const k = "/feedback-images/", i = (u || "").indexOf(k);

    step++;

      if (!error && data) { const b = URL.createObjectURL(data); imgFix.set(url, b); img.src = b; return; }

  if (file.size > MAX_IMG) throw new Error("Image trop lourde (5 Mo maximum).");
  const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `${uid}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext || "png"}`;
  const { error } = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type });
  if (error) throw new Error(error.message);
  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function uploadAudio(blob) {
  if (blob.size > MAX_IMG) throw new Error("Vocal trop lourd (5 Mo maximum).");
  const ext = /mp4/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";
  const path = `${uid}/vocal-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "audio/webm" });
  if (error) throw new Error(error.message);
  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

/* ---------- Sonnette de comptoir dynamique (générée par le navigateur, aucun fichier à ajouter) ---------- */
const REMIND_MS = 8000;   // feedback urgent : l'alarme se répète tant que le pop-up n'est pas traité
let remindTimer = null;
const ringKind = rows => rows.some(f => f.urgence) ? "urgent" : "simple";
function syncReminder() {
  const urgent = queue.some(f => f.urgence);
  if (urgent && !remindTimer) remindTimer = setInterval(() => { if (queue.some(f => f.urgence)) playRing("urgent"); }, REMIND_MS);
  if (!urgent && remindTimer) { clearInterval(remindTimer); remindTimer = null; }
}
const seen = new Set(); // feedbacks déjà annoncés par la cloche

async function refresh() {
  const rows = await fetchUnread();
  if (!rows) return; // erreur réseau : on garde l'affichage actuel
  const prev = queue[0]?.key;
  queue = rows;
  if (!queue.length) return finish();
  const fresh = queue.filter(f => !seen.has(f.key));
  if (fresh.length) playRing(ringKind(fresh)); // simple : une notification discrète ; urgent : alarme
  syncReminder();
  queue.forEach(f => seen.add(f.key));
  if (queue[0].key !== prev) render();
  else $("counter").textContent = queue.length > 1 ? `${queue.length} messages à lire` : "1 message à lire";
}

$("go").addEventListener("click", async () => {
  const f = queue[0];
  if (!f || $("go").disabled) return;
  const text = $("reply").value.trim(), blob = popRec.blob(), hasImg = popPick.any();
  if (popRec.busy()) { $("err").textContent = "Terminez d'abord l'enregistrement du vocal."; return; }
  if (blob && hasImg) { $("err").textContent = "Joignez soit des photos, soit un vocal (pas les deux)."; return; }
  $("go").disabled = true;
  $("err").textContent = "";
  try {
    if (text || blob || hasImg) {
      const attach = blob ? await uploadAudio(blob) : await popPick.value();
      const { error } = await db.from("reponses").insert({ feedback_id: f.fid, auteur_id: uid, message: text, image_url: attach, lu_admin: false, lu_agent: true });
      if (error) throw new Error(error.message);
    }
    const { data, error } = f.kind === "rp"
      ? await db.from("reponses").update({ lu_agent: true }).eq("id", f.id).select("id")
      : await db.from("feedbacks").update({ lu: true }).eq("id", f.id).select("id");
    if (error || !data || !data.length) throw new Error(error ? error.message : "droits manquants");
  } catch (e) {
    $("err").textContent = "Envoi impossible : " + e.message;
    $("go").disabled = false;
    return;
  }
  await refresh();
});

$("rf").addEventListener("click", async () => {
  const b = $("rf");
  if (b.classList.contains("busy")) return;
  b.classList.add("busy");
  await loadAdminNames(true);
  await refresh();
  b.classList.remove("busy");
  toast("Actualisé");
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return finish(); // pas connecté : rien à bloquer
  uid = session.user.id;
  await loadAdminNames();
  await refresh();
  timer = setInterval(refresh, 10000); // les nouveaux feedbacks s'ajoutent à la file
})();
</script>
