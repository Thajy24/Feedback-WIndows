<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau feedback</title>
<script>
(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
document.documentElement.setAttribute("data-theme",t);})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#0f1330; --muted:#667091; --line:#e4e6f2; --accent:#4f46e5; --accent2:#7c3aed; --alert:#e11d48; --recv:#f1f2fa; --card:#fff; --bg:#f3f4fb;
    --grad:linear-gradient(135deg,#4f46e5,#7c3aed); }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.5 "Segoe UI",Inter,system-ui,-apple-system,sans-serif; color:var(--ink); display:flex; flex-direction:column; user-select:none; overflow:hidden;
    background:radial-gradient(700px 400px at 0% -10%,rgba(79,70,229,.16),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(6,182,212,.12),transparent 60%),var(--bg); }

  header { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; padding:16px 20px; color:#fff;
    background:linear-gradient(120deg,#1e1b6b 0%,#4f46e5 55%,#7c3aed 100%); box-shadow:0 10px 28px -12px rgba(79,70,229,.7); animation:drop .45s cubic-bezier(.2,.8,.2,1) both; }
  header::after { content:""; position:absolute; top:0; bottom:0; width:90px; left:-120px; background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent); transform:skewX(-20deg); animation:shine 5s ease-in-out infinite; }
  header .chip { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; flex:none; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(6px); }
  header .chip svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transform-origin:50% 10%; animation:swing 4s ease-in-out infinite; }
  header b { font-size:16px; font-weight:700; display:block; letter-spacing:-.01em; }
  header span { display:block; font-size:12px; opacity:.85; font-weight:500; }

  main { flex:1; overflow-y:auto; padding:18px 20px; user-select:text; }
  main.slide { animation:rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-weight:600; }
  .tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; background:#ece9ff; color:#5b3fd6; letter-spacing:.02em; }
  .bubble { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent2); border-radius:14px; padding:14px 18px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(15,19,48,.05),0 14px 30px -16px rgba(79,70,229,.35); }
  .bubble img { display:block; max-width:100%; max-height:240px; margin-top:10px; border-radius:10px; }
  .ctx { font-size:12px; color:#56608a; border-left:3px solid var(--accent); padding:6px 10px; margin-bottom:10px; overflow-wrap:anywhere; background:#eef0ff; border-radius:0 8px 8px 0; }

  footer { padding:14px 20px 18px; border-top:1px solid var(--line); background:var(--card); box-shadow:0 -10px 24px -18px rgba(15,19,48,.25); }
  label { display:block; font-size:12px; font-weight:700; color:#4b5478; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
  textarea { width:100%; min-height:80px; resize:none; font:inherit; padding:10px 12px; border:1px solid #d5d9ec; border-radius:10px; user-select:text; color:var(--ink); background:var(--card); transition:border-color .2s, box-shadow .2s; }
  textarea:hover { border-color:#b8bfe0; }
  textarea:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 4px rgba(79,70,229,.14); }
  button { width:100%; margin-top:10px; padding:11px; font:inherit; font-weight:600; color:#fff; background:var(--grad); border:0; border-radius:10px; cursor:pointer; box-shadow:0 8px 18px -8px rgba(79,70,229,.7); transition:transform .18s, box-shadow .18s, filter .18s; }
  button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 12px 24px -10px rgba(79,70,229,.8); filter:brightness(1.06); }
  button:active:not(:disabled) { transform:scale(.98); }
  button:disabled { opacity:.5; cursor:default; box-shadow:none; }
  .err { color:var(--alert); font-size:13px; font-weight:500; min-height:18px; margin:6px 0 0; }
  [hidden] { display:none !important; }

  @keyframes drop { from { transform:translateY(-100%); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes shine { 0%,60% { left:-120px; } 100% { left:110%; } }
  @keyframes swing { 0%,70%,100% { transform:rotate(0); } 75% { transform:rotate(14deg); } 80% { transform:rotate(-12deg); } 85% { transform:rotate(8deg); } 90% { transform:rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  html[data-theme=dark] { color-scheme:dark; --ink:#e8e9ff; --muted:#9aa3c7; --line:#262b55; --card:#11153a; --bg:#080b1d; --recv:#1a1f48; }
  html[data-theme=dark] body { background:radial-gradient(700px 400px at 0% -10%,rgba(79,70,229,.3),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(124,58,237,.2),transparent 60%),var(--bg); }
  html[data-theme=dark] textarea { background:#0b0e29; color:var(--ink); border-color:#2d3466; }
  html[data-theme=dark] label { color:#aab1da; }
  html[data-theme=dark] .tag { background:#2e2670; color:#c4b5fd; }
  html[data-theme=dark] .ctx { background:#1b2154; color:#b7bde0; }
  html[data-theme=dark] .bubble { border-left-color:#7c83ff; }
</style>
</head>
<body>
    <header>
    <div class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></div>
    <div>
      <b id="title">Nouveau feedback</b>
      <span id="counter">Chargement…</span>
    </div>
  </header>
  <main id="mainBox">
    <div class="meta"><span id="date"></span><span id="model" class="tag" hidden></span></div>
    <div id="ctx" class="ctx" hidden></div>
    <div id="bubble" class="bubble"></div>
  </main>
  <footer>
    <label for="reply">Votre réponse (facultatif)</label>
    <textarea id="reply" placeholder="Écrivez ici pour répondre…"></textarea>
    <p id="err" class="err" role="alert"></p>
    <button id="go" type="button" disabled>Marquer comme lu</button>
  </footer>

<script>
const db = supabase.createClient("https://mzjiyusbgtslfzchoykf.supabase.co", "sb_publishable_6JGumr_7n73O3U6MjRdgkw_5mZH46cc");
const $ = id => document.getElementById(id);
let uid = null, queue = [], timer = null;

function finish() {
  clearInterval(timer);
  clearInterval(remindTimer);
  $("go").disabled = true;
  $("counter").textContent = "Terminé";
  if (window.native) window.native.popupDone(); // ferme le pop-up et libère l'écran
  else $("bubble").textContent = "Tous les feedbacks sont lus. Vous pouvez fermer cet onglet.";
}

async function fetchUnread() {
  const [fb, rp] = await Promise.all([
    db.from("feedbacks").select("id,message,image_url,created_at,modele").eq("agent_id", uid).eq("lu", false),
    db.from("reponses").select("id,message,image_url,created_at,feedback_id,feedbacks!inner(agent_id,message)").eq("lu_agent", false).eq("feedbacks.agent_id", uid)
  ]);
  if (fb.error) return null;
  // deux sortes d'éléments : un nouveau feedback, ou une réponse de l'administrateur dans un feedback
  const items = fb.data.map(f => ({ ...f, kind: "fb", key: "f" + f.id, fid: f.id }));
  if (!rp.error) rp.data.forEach(r => items.push({
    id: r.id, kind: "rp", key: "r" + r.id, fid: r.feedback_id,
    message: r.message, image_url: r.image_url, created_at: r.created_at, ctx: r.feedbacks?.message || ""
  }));
  return items.sort((a, b) => a.created_at.localeCompare(b.created_at));
}

function render() {
  const f = queue[0];
  $("counter").textContent = queue.length > 1 ? `${queue.length} messages à lire` : "1 message à lire";
  $("title").textContent = f.kind === "rp" ? "Nouvelle réponse de l'administrateur" : "Nouveau feedback";
  $("ctx").hidden = f.kind !== "rp" || !f.ctx;
  $("ctx").textContent = f.kind === "rp" && f.ctx ? "En réponse à : " + f.ctx.slice(0, 160) : "";
  $("date").textContent = new Date(f.created_at).toLocaleString("fr-FR");
  $("model").hidden = !f.modele;
  $("model").textContent = f.modele ? "Modèle : " + f.modele : "";
  const b = $("bubble");
  b.replaceChildren();
  if (f.message) b.append(document.createTextNode(f.message));
  if (f.image_url) {
    const img = document.createElement("img");
    img.src = f.image_url; img.alt = "Image jointe";
    b.appendChild(img);
  }
  $("reply").value = "";
  updateBtn();
  $("go").disabled = false;
  $("reply").focus();
}
function updateBtn() { $("go").textContent = $("reply").value.trim() ? "Envoyer la réponse et continuer" : "Marquer comme lu"; }
$("reply").addEventListener("input", updateBtn);

/* ---------- Sonnette de comptoir dynamique (générée par le navigateur, aucun fichier à ajouter) ---------- */
const BELL_VOLUME = 0.8;  // 0 = muet, 1 = très fort
const DINGS = 3;          // nombre de coups à chaque sonnerie
const GAP = 0.14;         // secondes entre deux coups (plus petit = plus pressé)
const REMIND_MS = 8000;   // la sonnerie se répète tant que le pop-up n'est pas traité (0 = une seule fois)
let audioCtx = null, master = null, remindTimer = null;

function ding(t0, gain, base, ring) {
  const out = audioCtx.createGain();
  out.gain.value = 0.3 * BELL_VOLUME * gain;
  out.connect(master);

  // le « clac » métallique du marteau
  const len = Math.floor(audioCtx.sampleRate * 0.025);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const click = audioCtx.createBufferSource();
  click.buffer = buf;
  const hp = audioCtx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 3500;
  click.connect(hp).connect(out);
  click.start(t0);

  // la cloche : notes très aiguës qui s'éteignent à des rythmes différents
  [[1, 1, 1.5], [1.006, 0.8, 1.5], [2.32, 0.5, 1.0], [4.25, 0.3, 0.6], [6.63, 0.18, 0.35]].forEach(([ratio, amp, decay]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const dur = decay * ring;
    o.type = "sine";
    o.frequency.value = base * ratio;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(out);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  });
}

function playBell() {
  if (!BELL_VOLUME) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createDynamicsCompressor(); // évite la saturation quand les coups se chevauchent
      master.connect(audioCtx.destination);
    }
    audioCtx.resume().then(() => {
      const t = audioCtx.currentTime + 0.05;
      for (let i = 0; i < DINGS; i++) {
        const last = i === DINGS - 1;
        // chaque coup est un peu plus aigu et plus fort : effet « ça presse » ; le dernier résonne plus longtemps
        ding(t + i * GAP, 0.8 + i * 0.1, 2650 * (1 + i * 0.07), last ? 1.6 : 0.7);
      }
    }).catch(() => {});
  } catch (e) {}
}
function startReminder() {
  if (REMIND_MS && !remindTimer) remindTimer = setInterval(playBell, REMIND_MS);
}
const seen = new Set(); // feedbacks déjà annoncés par la cloche

async function refresh() {
  const rows = await fetchUnread();
  if (!rows) return; // erreur réseau : on garde l'affichage actuel
  const prev = queue[0]?.key;
  queue = rows;
  if (!queue.length) return finish();
  if (queue.some(f => !seen.has(f.key))) { playBell(); startReminder(); } // sonnerie à l'ouverture et à chaque nouveau feedback
  queue.forEach(f => seen.add(f.key));
  if (queue[0].key !== prev) render();
  else $("counter").textContent = queue.length > 1 ? `${queue.length} messages à lire` : "1 message à lire";
}

$("go").addEventListener("click", async () => {
  const f = queue[0];
  if (!f) return;
  const text = $("reply").value.trim();
  $("go").disabled = true;
  $("err").textContent = "";
  try {
    if (text) {
      const { error } = await db.from("reponses").insert({ feedback_id: f.fid, auteur_id: uid, message: text, lu_admin: false, lu_agent: true });
      if (error) throw new Error(error.message);
    }
    const { data, error } = f.kind === "rp"
      ? await db.from("reponses").update({ lu_agent: true }).eq("id", f.id).select("id")
      : await db.from("feedbacks").update({ lu: true }).eq("id", f.id).select("id");
    if (error || !data || !data.length) throw new Error(error ? error.message : "droits manquants");
  } catch (e) {
    $("err").textContent = "Envoi impossible : " + e.message;
    $("go").disabled = false;
    return;
  }
  await refresh();
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return finish(); // pas connecté : rien à bloquer
  uid = session.user.id;
  await refresh();
  timer = setInterval(refresh, 10000); // les nouveaux feedbacks s'ajoutent à la file
})();
</script>
</body>
</html>
