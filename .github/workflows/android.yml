name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        run: |
          set -e
          SRC=$(find . -name index.html -not -path "*/node_modules/*" -not -path "./android-build/*" | head -1)
          [ -n "$SRC" ] || { echo "index.html introuvable"; exit 1; }
          mkdir -p android-build/www
          cp "$SRC" android-build/www/index.html
          cd android-build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Feedback Platform" com.thajy.feedback --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android-build/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: feedback-android-apk
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
