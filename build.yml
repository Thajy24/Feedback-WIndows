name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "preload.js"
      - "offline.html"
      - "package.json"
      - "icon.png"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Numéro de version automatique
        shell: bash
        run: npm version "1.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Compiler et publier la mise à jour
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Feedback-Agence-Setup
          path: dist/*.exe
